[package]
name = "vestibule-retriever"
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["Creative-Difficulty"]

[dependencies]
unidb = { git = "https://github.com/Vimothy-s-Vestibule/unidb-schema" }

diesel = { version = "2.3.6", features = ["postgres", "chrono"] }
diesel-async = { version = "0.7.4", features = ["postgres", "deadpool"] }

thiserror = "2.0.18"
tokio = { version = "1", features = ["full"] }
tracing-subscriber = "0.3"
tracing = "0.1"
dotenvy = "0.15.7"

serenity = "0.12.5"
